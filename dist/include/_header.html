<header class="header_wrap">
	<div class="header_inner">
		<div class="header_left_panel">
			<a href="#" class="btn_header_menu"><span class="btn_header_menu_line"></span></a>
		</div>
		<h1 class="top_logo">
			<a href="#" class="top_logo_dom"><img src="./assets/images/toplogo.svg" alt="TWO CHAIRS" /></a>
		</h1>
		<div class="header_right_panel">
			<a href="#" class="btn_header_ico">
				<img src="./assets/images/ico_cart.svg" alt="" />
			</a>
		</div>
		<div class="total_info_wrap">
			<div class="total_info_panel">
				<div class="total_info_top_row">
					<div class="profile_chip_wrap">
						<div class="profile_ico">
							<img src="./assets/images/ico_default_men.png" alt="" />
						</div>
						<div class="text_cols">
							<p class="proflie_who_para">
								<strong class="em">김고객</strong>
								님(이수지점)
							</p>
						</div>
					</div>
					<div class="total_top_else_wrap">
						<a href="#" class="btn_total_close"></a>
					</div>
				</div>
				<div class="total_info_middle_row">
					<div class="total_mcont_block">
						<div class="facts_tb_wrap">
							<div class="facts_tb">
								<div class="facts_tr">
									<div class="facts_th"><span class="facts_keynode">등급</span></div>
									<div class="facts_td">
										<ul class="cell_inline_list">
											<li>
												<div class="level_dom_wrap">
													<span class="level_dom_ico" style="background-color: #222"></span>
													<span class="level_dom_text">블랙</span>
												</div>
											</li>
											<li><span class="cell_note_para">(2025-12-18일 선정)</span></li>
										</ul>
									</div>
								</div>
								<div class="facts_tr">
									<div class="facts_th"><span class="facts_keynode">보유포인트</span></div>
									<div class="facts_td">
										<div class="facts_td_block">
											<div class="number_subset highlight">
												<span class="number_set_dom">1,100,000</span>
												<span class="number_set_unit shape_circle">P</span>
											</div>
										</div>
										<div class="facts_td_block">
											<p class="facts_text_data">
												<span class="facts_text_slice">소멸예정 포인트-200,000</span>
												<span class="number_set_unit shape_circle">P</span>
												<span class="facts_text_slice">(2026.02.11일자)</span>
											</p>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div class="total_route_wrap">
							<ul class="total_route_list">
								<li>
									<a href="#" class="total_route">
										<i class="ico shape_app"></i>
										<span class="text_node">신청 내역</span>
									</a>
								</li>
								<li>
									<a href="#" class="total_route">
										<i class="ico shape_point"></i>
										<span class="text_node">포인트 내역</span>
									</a>
								</li>
								<li>
									<a href="#" class="total_route">
										<i class="ico shape_center"></i>
										<span class="text_node">고객센터</span>
									</a>
								</li>
								<li>
									<a href="#" class="total_route">
										<i class="ico shape_list"></i>
										<span class="text_node">고객 리스트</span>
									</a>
								</li>
							</ul>
						</div>
						<div class="total_else_route_row">
							<a href="#" class="logo_route_item">
								<img src="./assets/images/woori_bank_logo.png" class="logo_img" alt="" />
								<span class="route_text_node">원뱅킹 바로가기</span>
								<i class="ico link_type"></i>
							</a>
						</div>
						<div class="total_util_action_wrap">
							<a href="#" class="btn_role_box">로그아웃</a>
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>
</header>
