<!DOCTYPE html>
<html lang="ko">
  @@include('./include/_head.html')

  <body class="front_body">
    <div class="page_wrap">
      @@include('./include/_header.html')
      <main class="middle_wrap">
        <div class="breadcrumb_wrap">
          <ul class="breadcrumb_list">
            <li><a href="#" class="breadcrumb_ico_item home"></a></li>
            <li><a href="#" class="breadcrumb_item highlight">장바구니</a></li>
          </ul>
        </div>
        <div class="page_title_row">
          <h2 class="page_title"></h2>
          <div class="page_title_else_wrap">
            <ul class="page_process_list">
              <li class="active"><span class="page_process_item">01 장바구니</span></li>
              <li><span class="page_process_item">02 신청/결제</span></li>
              <li><span class="page_process_item">03 주문완료</span></li>
            </ul>
          </div>
        </div>
        <div class="board_data_container">
          <div class="board_data_cols">
            <div class="board_control_top_row">
              <div class="bc_main_cols">
                <div class="props_item">
                  <input type="checkbox" class="props_dom" id="list_total" />
                  <label for="list_total" class="props_label">전체선택</label>
                </div>
              </div>
              <div class="bc_sub_cols">
                <ul class="btn_task_list">
                  <li><a href="#" class="btn_task_box">선택 상품 삭제</a></li>
                  <li><a href="#" class="btn_task_box">쇼핑 계속하기</a></li>
                </ul>
              </div>
            </div>
            <div class="board_group_box">
              <div class="board_tbody_wrap">
                <div class="respon_board_tr">
                  <div class="main_cell_group">
                    <div class="product_summary_container">
                      <div class="props_cell"></div>
                      <div class="img_cell"></div>
                      <div class="spec_cell"></div>
                    </div>
                  </div>
                  <div class="sub_cell_group">
                    <ul class="sub_cell_list">
                      <li>
                        <span class="board_list_node">1개</span>
                      </li>
                      <li>
                        <dl class="board_data_obj">
                          <dt><strong class="board_data_key">유효기간</strong></dt>
                          <dd><span class="board_data_value">2025.12.15~2026.12.14</span></dd>
                        </dl>
                      </li>
                      <li>
                        <div class="board_cell_block">
                          <div class="number_text_package">
                            <span class="number_text_node">400,000</span>
                            <span class="number_text_unit">P</span>
                          </div>
                        </div>
                        <div class="board_cell_block">
                          <a href="#" class="btn_task_box line_active">신청하기</a>
                        </div>
                      </li>
                      <li>
                        <span class="board_list_node">무료배송</span>
                      </li>
                    </ul>
                  </div>
                </div>
                <div class="board_tr"></div>
                <div class="board_tr"></div>
              </div>
              <div class="board_footer_wrap"></div>
            </div>
          </div>
          <div class="board_pay_cols"></div>
        </div>
      </main>
      <!-- popup -->
      <div class="popup_wrap" id="product_check_popup">
        <div class="bg_dim"></div>
        <div class="popup_box_tb_wrap">
          <div class="popup_box_tb">
            <div class="popup_box_td">
              <div class="popup_box_container theme_2">
                <div class="popup_title_bar">
                  <h2 class="popup_title">신청확인</h2>
                </div>
                <div class="popup_shell_wrap">
                  <div class="popup_shell_message_wrap">
                    <p class="popup_shell_main_message">
                      선택한 3개의 상품을
                      <br />
                      신청 하시겠어요?
                    </p>
                  </div>
                  <div class="popup_shell_btn_wrap btn_quad_wrap">
                    <a href="#" class="btn_quad size2 close_trigger"><span class="text_node">신청취소</span></a>
                    <a href="#" class="btn_quad size2 primary close_trigger"><span class="text_node">신청하기</span></a>
                  </div>
                </div>
                <a href="javascript:;" class="btn_popup_close"></a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- // popup -->
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          // 인스턴스 선언
          let product_check_popup = new DesignPopup({
            selector: "#product_check_popup",
            beforeCallback() {},
            callback() {},
            closeCallback() {},
          });
          // 퍼블확인용
          let url = window.location.href.split("?")[1];
          let url_2 = url !== undefined ? url.split("#")[0] : null;
          if (url_2 === "popup") {
            product_check_popup.popupShow(); // show
            // designPopup2.popupShow(); // hide
          }
        });
      </script>
      @@include('./include/_footer.html')
    </div>
  </body>
</html>
