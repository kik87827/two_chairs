<!DOCTYPE html>
<html lang="ko">
  @@include('./include/_head.html')

  <body class="front_body">
    <div class="page_wrap">
      @@include('./include/_header.html')
      <main class="middle_wrap">
        <div class="single_form_container">
          <div class="single_form_inner">
            <div class="single_top_copy_wrap">
              <p class="main_copy">
                우리은행
                <strong>TWO CHAIRS</strong>
                <br class="mb_br" />
                사이트에 오신것을 환영합니다.
              </p>
              <p class="sub_copy">로그인 후 상품을 신청하실 수 있어요.</p>
            </div>
            <div class="single_middle_box">
              <div class="main_form_row">
                <div class="field_top_wrap">
                  <div class="field_logo_row"><img src="./assets/images/login_logo.svg" alt="" /></div>
                  <div class="field_logo_copy">지점코드와 비밀번호를 확인해주세요.</div>
                </div>
                <div class="field_middle_wrap">
                  <form>
                    <div class="field_form_block_wrap">
                      <div class="field_form_block">
                        <div class="label_row"><p class="field_label_para">이메일 주소</p></div>
                        <div class="form_row"><input type="text" class="field_input_box" placeholder="이메일 주소를 입력하세요" /></div>
                      </div>
                      <div class="field_form_block">
                        <div class="label_row"><p class="field_label_para">비밀번호</p></div>
                        <div class="form_row"><input type="password" autocomplete class="field_input_box" placeholder="● ● ● ● ● ● ● ●" /></div>
                      </div>
                    </div>
                    <div class="btn_field_submit_row"><a href="#" class="btn_field_submit">로그인</a></div>
                  </form>
                </div>
              </div>
              <div class="sub_form_row">
                <p class="note_para">* 지점코드 및 비밀번호를 잊으셨다면, 고객센터 (1699-0000) 으로 문의 주세요.</p>
              </div>
            </div>
          </div>
        </div>
      </main>
      @@include('./include/_footer.html', { btnTop : true})
    </div>
  </body>
</html>
